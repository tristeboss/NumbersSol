<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #111318;
            color: #ffffff;
            font-family: 'Rubik', Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Ekran wczytywania na środku */
        .preloader {
            position: fixed;
            inset: 0;
            background-color: #111318;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.45s ease;
        }

        .preloader.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-spinner {
            position: relative;
            width: 84px;
            height: 84px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-spinner img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            display: block;
            position: relative;
            z-index: 2;
            will-change: transform, filter;
            animation: smoothSpinBlur 1.15s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }

        .loader-spinner::after {
            content: "";
            position: absolute;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(153, 69, 255, 0.35) 0%, rgba(20, 241, 149, 0.18) 55%, transparent 75%);
            filter: blur(10px);
            z-index: 1;
            animation: pulseGlow 1.15s ease-in-out infinite;
        }

        @keyframes smoothSpinBlur {
            0% {
                transform: rotate(0deg) scale(1);
                filter: url(#motionBlurX) brightness(1.05);
            }
            25% {
                transform: rotate(90deg) scale(1.03);
                filter: url(#motionBlurY) brightness(1.12);
            }
            50% {
                transform: rotate(180deg) scale(1);
                filter: url(#motionBlurX) brightness(1.05);
            }
            75% {
                transform: rotate(270deg) scale(1.03);
                filter: url(#motionBlurY) brightness(1.12);
            }
            100% {
                transform: rotate(360deg) scale(1);
                filter: url(#motionBlurX) brightness(1.05);
            }
        }

        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(0.92);
                opacity: 0.65;
            }
            50% {
                transform: scale(1.22);
                opacity: 1;
            }
        }

        .navbar {
            position: relative;
            width: 100%;
            height: 66px;
            background-color: #111318;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 19%;
            padding-right: 19%;
            border-bottom: 1px solid #22252e;
            overflow: visible;
            z-index: 30;
        }

        .nav-left {
            display: flex;
            align-items: center;
        }

        .nav-left img {
            height: 72px;
            width: auto;
            display: block;
        }

        /* Dokładny środek całego ekranu */
        .nav-center {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
        }

        .balance-box {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 40px;
            padding: 0 14px;
            background-color: #1a1d24;
            border: 1px solid #262a34;
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Rubik', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .balance-box:hover {
            background-color: #20242d;
            border-color: #343946;
        }

        .balance-box img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            display: block;
        }

        /* Główny obszar gry pod paskiem */
        .main-content {
            position: relative;
            width: 100%;
            height: calc(100vh - 66px);
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .main-content > img.bg-track {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* =========================================
           INTERFEJS GRY (WIDOCZNY PO ZALOGOWANIU)
           ========================================= */
        .game-ui {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 20px 24px 26px;
        }

        .game-ui.is-hidden {
            display: none;
        }

        /* Kapsuła 0.00 nad cyfrą na środku toru */
        .track-balance-pill {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #1e2430;
            color: #ffffff;
            font-weight: 900;
            font-size: 20px;
            padding: 4px 18px;
            border-radius: 999px;
            letter-spacing: 0.6px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
        }

        /* Komunikat błędu nad przyciskiem BET */
        .balance-alert {
            min-height: 28px;
            margin-bottom: 10px;
            padding: 6px 18px;
            background-color: rgba(11, 14, 20, 0.92);
            border: 1px solid #ff2a2a;
            border-radius: 999px;
            color: #ff3b3b;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 0.4px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(6px);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .balance-alert.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Duży niebieski przycisk BET */
        .big-bet-btn {
            width: 310px;
            height: 76px;
            background-color: #46c3f6;
            border: none;
            border-radius: 38px;
            color: #ffffff;
            font-family: 'Rubik', sans-serif;
            font-weight: 900;
            font-size: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            margin-bottom: 18px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
            transition: background-color 0.15s ease, transform 0.12s ease;
        }

        .big-bet-btn:hover {
            background-color: #35b6ec;
        }

        .big-bet-btn:active {
            transform: scale(0.97);
        }

        /* Dolny czarny panel */
        .bottom-bar {
            width: 100%;
            max-width: 1180px;
            min-height: 128px;
            background-color: #07090d;
            border-radius: 64px;
            padding: 18px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        }

        /* Lewa kolumna: YOUR SOLANA ADDRES + pole z adresem + COPY */
        .address-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            flex: 1.25;
        }

        .address-title {
            font-weight: 900;
            font-size: 19px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: #ffffff;
            text-align: center;
        }

        .address-title span {
            color: #29b6f6;
        }

        .address-box-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 350px;
        }

        .address-pill {
            flex: 1;
            height: 36px;
            background-color: #1f2836;
            border-radius: 10px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            color: #d6e4f0;
            font-size: 11.5px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            user-select: all;
        }

        .copy-btn {
            height: 36px;
            padding: 0 14px;
            background-color: #29b6f6;
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Rubik', sans-serif;
            font-weight: 900;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .copy-btn:hover {
            background-color: #1da5e6;
        }

        .copy-btn:active {
            transform: scale(0.96);
        }

        .copy-btn.is-copied {
            background-color: #16a34a;
        }

        /* Środkowa sekcja: MIN/MAX DEPOSIT + WARNING */
        .limits-warning-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            flex: 1.5;
        }

        .limits-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .limits-col span {
            color: #19e619;
        }

        .warning-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 240px;
        }

        .warning-title {
            color: #ff1e1e;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
        }

        .warning-desc {
            color: #ff1e1e;
            font-weight: 900;
            font-size: 9.5px;
            line-height: 1.35;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        /* Prawa sekcja: BET: [ 0.00 ] + logo Solany */
        .bet-input-section {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 22px;
            flex: 1;
        }

        .bet-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .bet-label {
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 0.6px;
            color: #ffffff;
        }

        .bet-amount-box {
            width: 112px;
            height: 36px;
            background-color: #1f2836;
            border: 1px solid transparent;
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Rubik', sans-serif;
            font-weight: 900;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        .bet-amount-box:hover {
            border-color: #ff2a2a;
            background-color: #253040;
        }

        .bottom-sol-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            display: block;
        }

        /* =========================================
           NAKŁADKA Z MENU HASŁA
           ========================================= */
        .password-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 16px;
        }

        .password-overlay.is-hidden {
            display: none;
        }

        .password-card {
            width: 100%;
            max-width: 390px;
            background-color: #0b0e14;
            border-radius: 72px;
            padding: 34px 36px 38px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 22px 55px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(56, 189, 248, 0.14);
        }

        .card-logo {
            width: 44px;
            height: 44px;
            object-fit: contain;
            margin-bottom: 18px;
            display: block;
        }

        .field-label {
            font-family: 'Rubik', sans-serif;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 10px;
            text-align: center;
        }

        .field-label span {
            color: #29b6f6;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            max-width: 245px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }

        .password-input {
            width: 100%;
            height: 38px;
            background-color: #1c2432;
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 0 54px 0 14px;
            color: #ffffff;
            font-family: 'Rubik', sans-serif;
            font-size: 14px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .password-input:focus {
            border-color: #29b6f6;
        }

        .password-input.is-error {
            border-color: #ff2a2a;
            box-shadow: 0 0 0 2px rgba(255, 42, 42, 0.2);
            animation: shakeInput 0.28s ease;
        }

        .toggle-pass-btn {
            position: absolute;
            right: 8px;
            height: 24px;
            padding: 0 8px;
            background-color: #263144;
            border: none;
            border-radius: 6px;
            color: #29b6f6;
            font-family: 'Rubik', sans-serif;
            font-weight: 900;
            font-size: 10px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .toggle-pass-btn:hover {
            background-color: #2f3c54;
            color: #ffffff;
        }

        @keyframes shakeInput {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .wrong-text {
            min-height: 20px;
            font-family: 'Rubik', sans-serif;
            font-weight: 900;
            font-size: 13px;
            letter-spacing: 0.5px;
            color: #ff2a2a;
            text-transform: uppercase;
            text-align: center;
            margin-top: -4px;
            margin-bottom: 12px;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .wrong-text.is-visible {
            opacity: 1;
        }

        .confirm-btn {
            min-width: 165px;
            height: 46px;
            padding: 0 28px;
            background-color: #29b6f6;
            border: none;
            border-radius: 23px;
            color: #ffffff;
            font-family: 'Rubik', sans-serif;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(41, 182, 246, 0.35);
            transition: background-color 0.15s ease, transform 0.12s ease;
        }

        .confirm-btn:hover {
            background-color: #1da5e6;
        }

        .confirm-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <!-- Filtr SVG dla efektu motion blur w osi X oraz Y -->
    <svg width="0" height="0" style="position: absolute; pointer-events: none;" aria-hidden="true">
        <defs>
            <filter id="motionBlurX" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="4.5 0.6" />
            </filter>
            <filter id="motionBlurY" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="0.6 4.5" />
            </filter>
        </defs>
    </svg>

    <!-- Ekran ładowania (2 sekundy) -->
    <div class="preloader" id="preloader">
        <div class="loader-spinner">
            <img src="sol.png" alt="Ładowanie...">
        </div>
    </div>

    <header class="navbar">
        <div class="nav-left">
            <img src="Nowy projekt (82).png" alt="Logo">
        </div>

        <div class="nav-center">
            <div class="balance-box" id="balanceBox">
                <img src="sol.png" alt="Ikona waluty">
                <span id="balanceAmount">SOL 0.00</span>
            </div>
        </div>
    </header>

    <main class="main-content">
        <img src="Zrzut ekranu 2026-11-22 155605.png" alt="Zrzut ekranu" class="bg-track" id="bgTrack">

        <!-- EKRAN GRY (odblokowywany po zalogowaniu) -->
        <div class="game-ui is-hidden" id="gameUi">
            <!-- 0.00 nad cyfrą na środku toru -->
            <div class="track-balance-pill">0.00</div>

            <!-- Komunikat błędu balansu -->
            <div class="balance-alert" id="balanceAlert">You dont have enough balance</div>

            <!-- Główny przycisk BET -->
            <button type="button" class="big-bet-btn" id="mainBetBtn">BET</button>

            <!-- Dolny panel -->
            <div class="bottom-bar">
                <!-- Lewa sekcja: Adres Solana + przycisk COPY -->
                <div class="address-section">
                    <div class="address-title">YOUR <span>SOLANA</span> ADDRES</div>
                    <div class="address-box-row">
                        <div class="address-pill" id="solanaAddress" title="4VCRoo3SLogGjANDAoFWhuQmtrc6TsXeBbKaX5yCmXfx">
                            4VCRoo3SLogGjANDAoFWhuQmtrc6TsXeBbKaX5yCmXfx
                        </div>
                        <button type="button" class="copy-btn" id="copyAddressBtn">COPY</button>
                    </div>
                </div>

                <!-- Środek: MIN/MAX DEPOSIT + WARNING -->
                <div class="limits-warning-section">
                    <div class="limits-col">
                        <div>MIN DEPOSIT: <span>0.05</span></div>
                        <div>MAX DEPOSIT: <span>0.5</span></div>
                    </div>

                    <div class="warning-col">
                        <div class="warning-title">!WARNING!</div>
                        <div class="warning-desc">
                            IF YOU DEPOSIT MORE THAN THE MAXIMUM OR LESS THAN THE MINIMUM YOU WILL RECEIVE NOTHING.
                        </div>
                    </div>
                </div>

                <!-- Prawa sekcja: BET 0.00 + Logo Solany -->
                <div class="bet-input-section">
                    <div class="bet-col">
                        <div class="bet-label">BET:</div>
                        <button type="button" class="bet-amount-box" id="betTabBox">0.00</button>
                    </div>
                    <img src="sol.png" alt="Solana" class="bottom-sol-logo">
                </div>
            </div>
        </div>

        <!-- Nakładka Rejestracji / Logowania -->
        <div class="password-overlay" id="authOverlay">

            <!-- 1. FORMULARZ REJESTRACJI -->
            <form class="password-card" id="registerForm" autocomplete="off">
                <img src="sol.png" alt="Solana Logo" class="card-logo">

                <label for="createPassword" class="field-label">CREATE A <span>PASSWORD</span></label>
                <div class="input-wrapper">
                    <input type="password" id="createPassword" class="password-input" required>
                    <button type="button" class="toggle-pass-btn" data-target="createPassword">SEE</button>
                </div>

                <label for="confirmPassword" class="field-label">CONFIRM UR <span>PASSWORD</span></label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" class="password-input" required>
                    <button type="button" class="toggle-pass-btn" data-target="confirmPassword">SEE</button>
                </div>

                <div class="wrong-text" id="registerWrongText">Wrong</div>

                <button type="submit" class="confirm-btn">CONFIRM</button>
            </form>

            <!-- 2. FORMULARZ LOGOWANIA -->
            <form class="password-card" id="loginForm" autocomplete="off" style="display: none;">
                <img src="sol.png" alt="Solana Logo" class="card-logo">

                <label for="loginPassword" class="field-label">ENTER UR <span>PASSWORD</span></label>
                <div class="input-wrapper">
                    <input type="password" id="loginPassword" class="password-input" required>
                    <button type="button" class="toggle-pass-btn" data-target="loginPassword">SEE</button>
                </div>

                <div class="wrong-text" id="loginWrongText">Wrong</div>

                <button type="submit" class="confirm-btn">LOGIN</button>
            </form>

        </div>
    </main>

    <script>
        const SAVED_PASSWORD_KEY = "solana_arena_saved_password";
        const LOGGED_IN_KEY = "solana_arena_is_logged_in";
        const WALLET_ADDRESS = "4VCRoo3SLogGjANDAoFWhuQmtrc6TsXeBbKaX5yCmXfx";
        const LOGGED_IN_BG = "gierka.png";

        window.addEventListener("DOMContentLoaded", () => {
            const preloader = document.getElementById("preloader");
            const authOverlay = document.getElementById("authOverlay");
            const gameUi = document.getElementById("gameUi");
            const bgTrack = document.getElementById("bgTrack");
            const balanceAmount = document.getElementById("balanceAmount");

            const registerForm = document.getElementById("registerForm");
            const createPassword = document.getElementById("createPassword");
            const confirmPassword = document.getElementById("confirmPassword");
            const registerWrongText = document.getElementById("registerWrongText");

            const loginForm = document.getElementById("loginForm");
            const loginPassword = document.getElementById("loginPassword");
            const loginWrongText = document.getElementById("loginWrongText");

            // Elementy widoku gry
            const copyAddressBtn = document.getElementById("copyAddressBtn");
            const mainBetBtn = document.getElementById("mainBetBtn");
            const betTabBox = document.getElementById("betTabBox");
            const balanceAlert = document.getElementById("balanceAlert");
            let alertTimeout = null;

            function setSolBalance(amount = 0) {
                balanceAmount.textContent = `SOL ${Number(amount).toFixed(2)}`;
            }

            function unlockGameScreen() {
                bgTrack.src = LOGGED_IN_BG;
                setSolBalance(0);
                authOverlay.classList.add("is-hidden");
                gameUi.classList.remove("is-hidden");
            }

            setSolBalance(0);

            // Sprawdzenie stanu przy wejściu/odświeżeniu strony
            const savedPass = localStorage.getItem(SAVED_PASSWORD_KEY);
            const isLoggedIn = localStorage.getItem(LOGGED_IN_KEY) === "true";

            if (isLoggedIn && savedPass) {
                unlockGameScreen();
            } else if (savedPass) {
                registerForm.style.display = "none";
                loginForm.style.display = "flex";
            }

            // Ekran ładowania (2 sekundy)
            setTimeout(() => {
                preloader.classList.add("is-hidden");
            }, 2000);

            // Przyciski SEE / HIDE przy hasłach
            document.querySelectorAll(".toggle-pass-btn").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const input = document.getElementById(btn.dataset.target);
                    if (input.type === "password") {
                        input.type = "text";
                        btn.textContent = "HIDE";
                    } else {
                        input.type = "password";
                        btn.textContent = "SEE";
                    }
                });
            });

            // Walidacja hasła: min. 5 znaków, 1 wielka litera, 1 mała litera, 1 symbol
            function isValidPassword(pass) {
                const hasMinLength = pass.length >= 5;
                const hasUpper = /[A-Z]/.test(pass);
                const hasLower = /[a-z]/.test(pass);
                const hasSymbol = /[^A-Za-z0-9]/.test(pass);
                return hasMinLength && hasUpper && hasLower && hasSymbol;
            }

            function showRegisterError(msg) {
                registerWrongText.textContent = msg;
                registerWrongText.classList.add("is-visible");
            }

            function clearRegisterError() {
                registerWrongText.classList.remove("is-visible");
                createPassword.classList.remove("is-error");
                confirmPassword.classList.remove("is-error");
            }

            createPassword.addEventListener("input", clearRegisterError);
            confirmPassword.addEventListener("input", clearRegisterError);

            // Obsługa REJESTRACJI
            registerForm.addEventListener("submit", (e) => {
                e.preventDefault();
                clearRegisterError();

                const pass1 = createPassword.value;
                const pass2 = confirmPassword.value;

                if (!isValidPassword(pass1)) {
                    createPassword.classList.add("is-error");
                    createPassword.focus();
                    showRegisterError("WRONG (MIN 5 CHARS, A-Z, a-z, SYMBOL)");
                    return;
                }

                if (pass1 !== pass2) {
                    confirmPassword.classList.add("is-error");
                    confirmPassword.focus();
                    showRegisterError("WRONG");
                    return;
                }

                localStorage.setItem(SAVED_PASSWORD_KEY, pass1);
                registerForm.style.display = "none";
                loginForm.style.display = "flex";
                loginPassword.focus();
            });

            // Obsługa LOGOWANIA
            loginPassword.addEventListener("input", () => {
                loginWrongText.classList.remove("is-visible");
                loginPassword.classList.remove("is-error");
            });

            loginForm.addEventListener("submit", (e) => {
                e.preventDefault();

                const entered = loginPassword.value;
                const stored = localStorage.getItem(SAVED_PASSWORD_KEY);

                if (entered !== stored) {
                    loginPassword.classList.add("is-error");
                    loginWrongText.textContent = "WRONG";
                    loginWrongText.classList.add("is-visible");
                    loginPassword.focus();
                    return;
                }

                localStorage.setItem(LOGGED_IN_KEY, "true");
                unlockGameScreen();
            });

            // Kopiowanie adresu Solana
            copyAddressBtn.addEventListener("click", async () => {
                try {
                    await navigator.clipboard.writeText(WALLET_ADDRESS);
                } catch (err) {
                    const tempInput = document.createElement("input");
                    tempInput.value = WALLET_ADDRESS;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand("copy");
                    document.body.removeChild(tempInput);
                }

                copyAddressBtn.textContent = "COPIED!";
                copyAddressBtn.classList.add("is-copied");

                setTimeout(() => {
                    copyAddressBtn.textContent = "COPY";
                    copyAddressBtn.classList.remove("is-copied");
                }, 1500);
            });

            // Komunikat "You dont have enough balance" po kliknięciu BET lub zakładki BET 0.00
            function showNoBalanceWarning() {
                balanceAlert.textContent = "You dont have enough balance";
                balanceAlert.classList.add("is-visible");

                if (alertTimeout) clearTimeout(alertTimeout);
                alertTimeout = setTimeout(() => {
                    balanceAlert.classList.remove("is-visible");
                }, 2600);
            }

            mainBetBtn.addEventListener("click", showNoBalanceWarning);
            betTabBox.addEventListener("click", showNoBalanceWarning);
        });
    </script>

</body>
</html>
