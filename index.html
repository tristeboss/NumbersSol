<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #111318;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .navbar {
            position: relative;
            width: 100%;
            height: 66px;
            background-color: #111318;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 19%;
            padding-right: 19%;
            border-bottom: 1px solid #22252e;
            overflow: visible;
        }

        .nav-left {
            display: flex;
            align-items: center;
        }

        .nav-left img {
            height: 72px;
            width: auto;
            display: block;
        }

        /* Dokładny środek całego ekranu */
        .nav-center {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
        }

        .balance-box {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 40px;
            padding: 0 14px;
            background-color: #1a1d24;
            border: 1px solid #262a34;
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Rubik', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .balance-box:hover {
            background-color: #20242d;
            border-color: #343946;
        }

        .balance-box img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            display: block;
        }

        .chevron {
            color: #9aa0b0;
            font-size: 11px;
            margin-left: 2px;
        }

        /* Główny kontener łączący lewy panel + obszar gry */
        .game-wrapper {
            display: flex;
            margin-left: 3%;
            margin-right: 3%;
            margin-top: 22px;
            margin-bottom: 22px;
            height: calc(100vh - 110px);
            background-color: #181b22;
            border: 1px solid #22252e;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Dorobiony panel boczny (zaznaczony białą ramką) */
        .sidebar {
            width: 240px;
            min-width: 240px;
            height: 100%;
            background-color: #181b22;
            border-right: 1px solid #22252e;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Obszar główny (obrazek po prawej stronie panelu) */
        .main-content {
            flex: 1;
            height: 100%;
            position: relative;
        }

        .main-content img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-left">
            <img src="Nowy projekt (82).png" alt="Logo">
        </div>

        <div class="nav-center">
            <div class="balance-box" id="balanceBox">
                <img src="sol.png" alt="Ikona waluty">
                <span id="balanceAmount">PLN 0.00</span>
                <span class="chevron">⌄</span>
            </div>
        </div>
    </header>

    <div class="game-wrapper">
        <!-- Dorobiony panel boczny z lewej strony -->
        <aside class="sidebar">
            <!-- Tutaj możesz wrzucić przyciski / stawki / opcje gry -->
        </aside>

        <!-- Główny ekran gry -->
        <main class="main-content">
            <img src="Zrzut ekranu 2026-11-22 155605.png" alt="Zrzut ekranu">
        </main>
    </div>

</body>
</html>
