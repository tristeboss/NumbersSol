<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solana Numbers</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0f14;
      font-family: Arial, sans-serif;
      color: #ffffff;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    .topbar {
      height: 64px;
      padding: 0 24px;
      background: #14171f;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sol-bars {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 24px;
    }

    .sol-bars span {
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(90deg, #14f195, #9945ff);
    }

    .sol-bars span:nth-child(1) { transform: skewX(-20deg); }
    .sol-bars span:nth-child(2) { transform: skewX(20deg); }
    .sol-bars span:nth-child(3) { transform: skewX(-20deg); }

    .balance-box {
      background: #1c212c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .workspace {
      flex: 1;
      height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 16px 24px;
      gap: 24px;
    }

    /* Miejsce po lewej zostawione pod panele / stawki */
    .left-space {
      flex: 1;
      height: 100%;
    }

    /* Kwadrat 1:1 mieszczący się na wysokość ekranu */
    .game-square {
      position: relative;
      height: 100%;
      aspect-ratio: 1 / 1;
      max-width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(180deg, #7ec8ff 0%, #3b8ef6 100%);
      flex-shrink: 0;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="sol-bars">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div>SOLANA<br />NUMBERS</div>
      </div>
      <div class="balance-box" id="balance">PLN 0.00</div>
    </header>

    <main class="workspace">
      <aside class="left-space" id="leftSpace"></aside>

      <section class="game-square" id="gameSquare">
        <canvas id="gameCanvas"></canvas>
      </section>
    </main>
  </div>

  <script>
    const square = document.getElementById('gameSquare');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let zoom = 1.05;

    function resizeCanvas() {
      const rect = square.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawScene(rect.width, rect.height);
    }

    function drawScene(w, h) {
      ctx.clearRect(0, 0, w, h);

      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, '#82cbff');
      sky.addColorStop(1, '#3c8cf5');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.translate(w / 2, h * 0.78);
      ctx.scale(zoom, zoom);

      const roadTopW = w * 0.22;
      const roadBotW = w * 0.72;
      const roadTopY = -h * 0.62;
      const roadBotY = h * 0.24;

      ctx.beginPath();
      ctx.moveTo(-roadTopW / 2, roadTopY);
      ctx.lineTo(roadTopW / 2, roadTopY);
      ctx.lineTo(roadBotW / 2, roadBotY);
      ctx.lineTo(-roadBotW / 2, roadBotY);
      ctx.closePath();
      ctx.fillStyle = 'rgba(245, 249, 255, 0.92)';
      ctx.fill();

      ctx.strokeStyle = 'rgba(130, 175, 235, 0.45)';
      ctx.lineWidth = 2;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(i * (roadTopW / 6), roadTopY);
        ctx.lineTo(i * (roadBotW / 6), roadBotY);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(0, roadTopY * 0.35, Math.max(5, w * 0.012), 0, Math.PI * 2);
      ctx.fillStyle = '#5a67f2';
      ctx.fill();

      ctx.restore();
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
